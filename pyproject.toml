[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-osint"
dynamic = ["version"]
description = "Open-source link analysis & OSINT workbench: entities, transforms, machines and Ariadne's thread to find the paths between them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Alejandro Brea" }]
keywords = ["osint", "maltego", "link-analysis", "graph", "investigation", "threat-intelligence", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "dnspython>=2.6",
    "phonenumbers>=8.13",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
daedalus = "daedalus.__main__:main"

[project.urls]
Homepage = "https://github.com/BreaGG/DAEDALUS"
Issues = "https://github.com/BreaGG/DAEDALUS/issues"

[tool.setuptools.dynamic]
version = { attr = "daedalus.__version__" }

[tool.setuptools.packages.find]
include = ["daedalus*"]

[tool.setuptools.package-data]
daedalus = ["web/*.html", "web/*.svg", "web/css/*", "web/js/*", "web/vendor/*", "web/vendor/images/*", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904", "B905"]
